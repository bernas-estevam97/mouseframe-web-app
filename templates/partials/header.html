{% load static %}
{% with current=request.resolver_match.url_name %}
<header class="site-header">
  <a class="brand" href="{% url 'welcome' %}" aria-label="MouseFrame home">
    <img src="{% static 'img/mice_paws-header.jpg' %}" alt="" width="136" height="48">
    <span>
      <span class="brand-name">MouseFrame</span>
      <span class="brand-tag">Gait and footprint analysis</span>
    </span>
  </a>
  <nav class="site-nav" aria-label="Main">
    <a href="{% url 'home' %}"{% if current == 'home' %} aria-current="page"{% endif %}>Analysis</a>
    <a href="{% url 'info' %}"{% if current == 'info' %} aria-current="page"{% endif %}>Information</a>
    <a href="{% url 'contact' %}"{% if current == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    <a href="{% url 'support' %}"{% if current == 'support' %} aria-current="page"{% endif %}>Support</a>
  </nav>
</header>
{% endwith %}
