<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'img/logo_mice.ico' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <title>MouseFrame - Contact</title>
</head>
<body>
    {% include 'partials/header.html' %}
    <main class="page">
        <div class="contact-intro">
            <div>
                <h1 class="page-title">Contact</h1>
                <p class="page-lead">Questions, bug reports and feature requests are welcome.</p>
            </div>
            <img src="{% static 'img/logo.png' %}" alt="MouseFrame logo" width="240" height="130">
        </div>

        <div class="contact-grid">
            <section class="panel">
                <h2>Email</h2>
                <p>The quickest way to reach the developer.</p>
                <a href="mailto:mouseframe.app@gmail.com">mouseframe.app@gmail.com</a>
            </section>
            <section class="panel">
                <h2>Developer</h2>
                <p class="profile">
                    <img src="{% static 'img/icon-sm.png' %}" alt="">
                    <a href="https://bernas-estevam97.github.io/" target="_blank" rel="noopener">Bernardo Estevam, web portfolio</a>
                </p>
                <div class="social">
                    <a href="https://www.linkedin.com/in/bernas-estevam97/" target="_blank" rel="noopener" aria-label="LinkedIn profile"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="https://github.com/bernas-estevam97/" target="_blank" rel="noopener" aria-label="GitHub profile"><i class="fa-brands fa-github"></i></a>
                </div>
            </section>
        </div>
    </main>
    {% include 'partials/footer.html' %}
    <script src="{% static 'js/simple-version-control.js' %}"></script>
</body>
</html>
